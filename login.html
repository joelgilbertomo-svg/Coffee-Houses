<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieZone - Iniciar Sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header>
        <h1>MovieZone</h1>
        <a href="index.html" class="btn-regresar">Volver al Inicio</a>
    </header>

    <main class="login-main">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <div class="login-footer">
                <p>¿Nuevo en MovieZone? <a href="registrar.html">Regístrate ahora</a>.</p>
                <p class="ayuda"><a href="#">¿Necesitas ayuda?</a></p>
            </div>
        </div>
    </main>

    <footer>
        <h3>©2026 Joel Morel</h3>
        <div class="footer-links">
            <a href="#">Términos de uso</a>
            <a href="#">Privacidad</a>
        </div>
    </footer>

    <script src="login.js"></script>
</body>
</html>
