<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieZone - Registrarse</title>
    <link rel="stylesheet" href="login.css"> 
</head>

<body>

    <header>
        <h1>MovieZone</h1>
        <a href="index.html" class="btn-regresar">Volver al Inicio</a>
    </header>

    <main class="login-main">
        <div class="login-box">
            <h2>Registrarse</h2>
            <form id="registroForm">
                <div class="input-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" placeholder="Tu nombre o alias" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Crea una contraseña" required>
                </div>

                <button type="submit" class="btn-login">Crear Cuenta</button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes cuenta en MovieZone? <a href="login.html">Inicia sesión aquí</a>.</p>
            </div>
        </div>
    </main>

    <footer>
        <h3>©2026 Joel Morel</h3>
        <div class="footer-links">
            <a href="#">Términos de uso</a>
            <a href="#">Privacidad</a>
        </div>
    </footer>

    <script src="registro.js"></script>
</body>
</html>
